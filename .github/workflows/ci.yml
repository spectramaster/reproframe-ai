name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra backblaze
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/bandit -q -r src
      - run: .venv/bin/pytest -q
      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 .venv/bin/detect-secrets-hook --

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reproframe-ai:ci .
